<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="VUTV Equipment Booking System — Smart equipment reservations and production kit planning for student producers">
<meta name="theme-color" content="#FBF6EA">
<link rel="icon" type="image/png" href="assets/vutv-logo.png">
<title>VUTV Equipment Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   VUTV Equipment Booking — Warm Gold & Ivory Theme
   =================================================================== */
:root{
  --bg:#FBF6EA; --bg-deep:#F3EAD6; --surface:#FFFDF7; --surface-line:rgba(41,35,27,.10);
  --ink:#29231B; --ink-soft:#574B3B; --muted:#8D8069;
  --gold:#AD7A24; --gold-deep:#7E5613; --gold-pale:#EEDFB8; --gold-pale-2:#F7EFDC;
  --navy:#363B5E; --navy-dk:#2A2E4B; --navy-lt:rgba(54,59,94,.08);
  --red:#9C3A34; --red-pale:#F1DFDA; --red-lt:rgba(156,58,52,.06);
  --green:#3E6B49; --green-pale:#DEEAE0; --green-br:#2EA043; --green-lt:rgba(62,107,73,.06);
  --shadow-soft:0 24px 60px -32px rgba(90,65,20,.35);
  --shadow-card:0 2px 0 rgba(41,35,27,.04),0 12px 30px -22px rgba(90,65,20,.28);
  --r:12px; --r-lg:18px; --r-sm:8px;
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --raised:var(--bg-deep); --sub:var(--ink-soft); --faint:var(--muted); --line:var(--surface-line);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink-soft);
  font-family:var(--sans);font-size:16px;line-height:1.65;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}

/* ========== REALISTIC PHONE SHELL (iPhone 17 Pro Max) ========== */
.fit{transform:scale(var(--k,.32));transform-origin:center center}
.phone{
  width:1326px;height:2880px;padding:22px;border-radius:185px;position:relative;
  background:#A499A6; /* Titanium purple */
  box-shadow:inset 0 0 12px rgba(255,255,255,0.4), inset 0 0 6px 3px rgba(0,0,0,0.4), 0 60px 160px rgba(40,30,50,.5);
}
.phone::before {
  content: ""; position: absolute; top: 480px; left: -8px; width: 8px; height: 90px; background: #8E8391; border-radius: 8px 0 0 8px;
  box-shadow: 0 150px 0 0 #8E8391, 0 340px 0 0 #8E8391; /* Action, Vol up, Vol down */
}
.phone::after {
  content: ""; position: absolute; top: 720px; right: -8px; width: 8px; height: 180px; background: #8E8391; border-radius: 0 8px 8px 0; /* Power */
}
.screen{width:1242px;height:2796px;background:var(--surface);border-radius:160px;overflow:hidden;position:relative; border:22px solid #111; box-sizing: content-box; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1)}
.device{width:414px;height:932px;transform:scale(3);transform-origin:top left;display:flex;flex-direction:column;position:relative;background:var(--surface)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;z-index:30; display:flex;align-items:center;justify-content:flex-end;padding: 0 12px;gap: 8px; box-shadow: inset 0 0 1px 1px rgba(255,255,255,0.05)}
.island::before{content:"";width:8px;height:8px;border-radius:50%;background:#091434;box-shadow:inset -1px -1px 3px rgba(255,255,255,0.2)}
.island::after{content:"";width:4px;height:4px;border-radius:50%;background:#2bd84d;filter:blur(0.5px);opacity:0.8}
.status{flex:0 0 auto;height:56px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 7px;font-size:15px;font-weight:700;letter-spacing:.01em;color:var(--ink);background:var(--surface)}
.status .right{display:flex;align-items:flex-end;gap:5px}
.bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.bars i{width:3px;background:var(--ink);border-radius:1px;display:block}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}
.batt{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:4px;position:relative;opacity:.9}
.batt::after{content:"";position:absolute;right:-3px;top:3.5px;width:2px;height:5px;background:var(--ink);border-radius:0 2px 2px 0}
.batt i{position:absolute;inset:2px;width:70%;background:var(--ink);border-radius:2px;display:block}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.3;z-index:25;pointer-events:none}
#app{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surface)}
@media(max-width:560px){
  .fit{transform:none}
  .phone{width:100vw;height:100vh;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none}
  .screen{width:100%;height:100%;border-radius:0}
  .device{width:100%;height:100%;transform:none}
  .island,.status,.homebar{display:none}
  body{overflow:hidden}
  .btn{padding:16px;font-size:15px;min-height:48px}
  .row{padding:14px 16px;min-height:48px}
  .fbtn{padding:9px 16px;font-size:13px;min-height:40px}
  .tabs button{padding:12px 0 8px;min-height:52px}
  .eq-book{padding:10px 18px;font-size:13px;min-height:40px}
  .slot{padding:14px 16px;min-height:48px}
  .body{-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .tabs{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom));left:12px;right:12px}
  .top{padding-top:calc(10px + env(safe-area-inset-top))}
  .reset-demo{display:none}
}

/* ========== HEADER ========== */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto;justify-content:space-between}
.top h1{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;flex:1;color:var(--ink);text-align:center}
.iconbtn{border:none;background:var(--raised);color:var(--ink);width:32px;height:32px;border-radius:10px;font-size:15px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:background .15s}
.iconbtn:hover{background:var(--gold-pale)}
.linkbtn{border:none;background:none;color:var(--gold-deep);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px}

/* ========== CONTENT ========== */
.body{flex:1;overflow-y:auto;padding:16px 16px 80px;display:flex;flex-direction:column;gap:14px}
.body::-webkit-scrollbar{width:0}
h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;letter-spacing:-.02em;color:var(--ink)}
.lead{font-size:13px;color:var(--sub);margin:-8px 0 0;line-height:1.5}
.label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:6px 0 -6px}

/* ========== CARDS ========== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-card);flex-shrink:0}
.card h3{margin:0;font-size:14px;font-weight:600;color:var(--ink)}
.card p{margin:4px 0 0;font-size:12.5px;color:var(--sub);line-height:1.45}
.hero-card{
  background:var(--bg-deep);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;cursor:pointer;text-align:left;
  width:100%;font:inherit;display:block;box-shadow:var(--shadow-card);transition:transform .12s ease,box-shadow .15s ease;flex-shrink:0;
}
.hero-card:active{transform:scale(.99)}
.hero-card .h-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-card .h-name{font-size:15px;font-weight:700;color:var(--ink)}
.hero-card .h-big{font-family:var(--serif);font-size:22px;font-weight:600;margin:10px 0 2px;color:var(--gold-deep)}
.hero-card .h-sub{font-size:12.5px;color:var(--sub)}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.chip .dot{width:5px;height:5px;border-radius:50%;background:var(--green-br);animation:pulse 2s ease infinite}

/* ========== BUTTONS ========== */
.btn{width:100%;border-radius:12px;padding:14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:transform .06s ease,opacity .15s ease,background .15s ease}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--gold);color:#fff}
.btn.primary:hover{background:var(--gold-deep)}
.btn.primary-ok{background:var(--green);color:#fff}
.btn.primary-navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-deep)}
.btn.quiet{background:none;color:var(--sub);border:none;font-weight:500;font-size:13px;padding:8px}
.btn.danger{background:var(--red-pale);color:var(--red);border-color:rgba(156,58,52,.15)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-direction:column;gap:10px}

/* ========== EQUIPMENT LIST ========== */
.eq{display:flex;align-items:flex-start;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;box-shadow:0 2px 4px rgba(41,35,27,.02);transition:border-color .15s,box-shadow .15s;flex-shrink:0}
.eq:hover{border-color:var(--gold-pale);box-shadow:var(--shadow-card)}
.eq-img{width:52px;height:52px;border-radius:10px;flex:0 0 auto;overflow:hidden;background:var(--bg-deep);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.eq-img img{width:100%;height:100%;object-fit:cover}
.eq-info{flex:1;min-width:0}
.eq-name{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:2px}
.eq-cat{font-size:12px;color:var(--sub)}
.eq-pills{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.eq-book{margin-top:8px;padding:7px 16px;border-radius:8px;background:var(--gold);color:#fff;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:background .12s}
.eq-book:hover{background:var(--gold-deep)}
.eq-book:active{opacity:.8}

/* ========== SEARCH ========== */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.02);transition:border-color .15s}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;font-size:14px;color:var(--ink);background:none;border:none;outline:none;font-family:inherit}
.search input::placeholder{color:var(--faint)}
.search .si{color:var(--faint);font-size:14px;flex:0 0 auto}

/* ========== FILTER PILLS ========== */
.filters{display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fbtn{white-space:nowrap;font-size:12px;font-weight:500;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--sub);cursor:pointer;font-family:inherit;transition:all .15s}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fbtn:hover:not(.on){border-color:var(--gold);color:var(--gold-deep)}

/* ========== PILLS/TAGS ========== */
.pill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px}
.p-avail{background:var(--green-pale);color:var(--green)}
.p-ready{background:rgba(46,160,67,.08);color:#15803D}
.p-inuse{background:var(--red-pale);color:var(--red)}
.p-repair{background:rgba(100,100,100,.08);color:#555}
.p-used{background:var(--gold-pale);color:var(--gold-deep)}
.p-confirmed{background:var(--green-pale);color:var(--green)}
.p-active{background:var(--navy-lt);color:var(--navy)}
.p-completed{background:var(--bg-deep);color:var(--sub)}
.p-returned{background:var(--gold-pale-2);color:var(--gold-deep)}
.dot-live{width:5px;height:5px;border-radius:50%;background:var(--green-br);animation:pulse 2s ease infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* ========== DETAIL ========== */
.d-img{height:180px;border-radius:var(--r-lg);overflow:hidden;background:var(--bg-deep);border:1px solid var(--line);position:relative;flex:0 0 auto}
.d-img img{width:100%;height:100%;object-fit:cover}
.d-badge{position:absolute;bottom:10px;left:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:600;padding:5px 12px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;box-shadow:var(--shadow-card)}

/* ========== SUMMARY TABLE ========== */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-card)}
.sum div{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.sum div:last-child{border-bottom:none}
.sum span{width:90px;color:var(--faint);flex:0 0 auto;font-size:12px;font-weight:500}
.sum b{font-weight:600;word-break:break-word;font-size:13px;color:var(--ink)}
.sum .ok{color:var(--green)}

/* ========== BATTERY ========== */
.bat-bar{width:36px;height:8px;border-radius:99px;background:var(--bg-deep);overflow:hidden;display:inline-block;vertical-align:middle}
.bat-fill{display:block;height:100%;background:var(--green);border-radius:99px}

/* ========== CALENDAR ========== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
.cal-nav{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:14px;font-family:inherit;transition:background .12s}
.cal-nav:hover{background:var(--bg-deep)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-lbl{font-size:10px;font-weight:600;color:var(--faint);text-align:center;padding:3px 0}
.cal-d{font-size:11.5px;font-weight:500;color:var(--ink);text-align:center;padding:5px;border-radius:50%;cursor:pointer;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:all .12s;position:relative}
.cal-d:hover:not(.sel):not(:disabled){background:var(--bg-deep)}
.cal-d.sel{background:var(--gold);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(173,122,36,.3)}
.cal-d.has-booking::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.cal-d.empty{pointer-events:none}
.cal-d:disabled{color:var(--faint);opacity:.4;cursor:not-allowed}
.cal-d:focus-visible,.cal-nav:focus-visible,.slot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ========== SLOTS ========== */
.slot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);transition:all .12s}
.slot.avail{cursor:pointer}
.slot.avail:hover{border-color:var(--gold);background:var(--bg-deep)}
.slot.taken{background:var(--bg-deep);opacity:.6;cursor:not-allowed}
.slot-time{font-size:13px;font-weight:600;color:var(--ink)}
.slot-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.02em}
.s-free{background:var(--green-pale);color:var(--green)}
.s-taken{background:var(--line);color:var(--faint)}

/* ========== DIVIDER ========== */
.divider{display:flex;align-items:center;gap:12px;margin:4px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider span{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}

/* ========== LOGO & KITS ========== */
.logo-sm { height: 28px; width: auto; display: block; object-fit: contain; flex: 0 0 auto; }

.kit-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-card);flex-shrink:0}
.kit-head{display:flex;align-items:center;gap:12px;padding:16px 14px;cursor:pointer;background:var(--surface)}
.kit-icon{width:44px;height:44px;border-radius:12px;background:var(--gold-pale-2);color:var(--gold-deep);display:grid;place-items:center;flex:0 0 auto}
.kit-info{flex:1;min-width:0}
.kit-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}
.kit-desc{font-size:12px;color:var(--sub);line-height:1.4}
.kit-count{font-size:12px;font-weight:700;color:var(--gold-deep);background:var(--gold-pale);padding:4px 8px;border-radius:8px;flex:0 0 auto}
.kit-items{display:flex;flex-direction:column;padding:8px 14px 14px;gap:6px}
.kit-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-deep);border-radius:10px;transition:transform .12s}
.kit-item:hover{transform:translateX(2px)}
.kit-item-icon{display:grid;place-items:center;flex:0 0 auto}
.kit-item-icon.ok{color:var(--green)}
.kit-item-icon.bad{color:var(--faint)}
.kit-item-name{flex:1;font-size:13.5px;font-weight:600;color:var(--ink)}

/* ========== NOTICE ========== */
.notice{display:flex;align-items:flex-start;gap:8px;background:var(--gold-pale-2);border:1px solid var(--gold-pale);border-radius:var(--r);padding:12px 14px;font-size:12px;color:var(--gold-deep);line-height:1.5}
.notice strong{display:block;font-size:12.5px;margin-bottom:2px}

/* ========== BANNER ========== */
.banner{border-radius:var(--r);padding:13px 14px;font-size:13px;line-height:1.45}
.banner.bad{background:var(--red-pale);color:var(--red)}
.banner.info{background:var(--navy-lt);color:var(--navy-dk)}
.banner.ok{background:var(--green-pale);color:var(--green)}
.banner strong{display:block;font-size:13.5px;margin-bottom:2px}

/* ========== SUCCESS ========== */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.badge{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:28px}
.badge.ok{background:var(--green-pale);color:var(--green);border:2px solid var(--green);animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) forwards}
.badge.bad{background:var(--red-pale);color:var(--red);border:2px solid var(--red);animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
.fade-up{animation:fadeUp .4s ease forwards;animation-delay:.2s;opacity:0}

/* ========== BOOKING CARDS ========== */
.bk{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 4px rgba(41,35,27,.02);transition:box-shadow .15s;flex-shrink:0}
.bk:hover{box-shadow:var(--shadow-card)}
.bk-content{display:flex;flex:1}
.bk-bar{width:4px;flex:0 0 auto}
.bk-bar.g{background:var(--green)}.bk-bar.n{background:var(--gold)}.bk-bar.d{background:var(--line)}
.bk-body{flex:1;padding:12px 14px}
.bk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bk-name{font-size:14.5px;font-weight:700;margin-bottom:2px;color:var(--ink)}
.bk-meta{font-size:12px;color:var(--sub);margin-bottom:2px}
.bk-loc{font-size:11px;color:var(--gold-deep);font-weight:500}
.bk-ref{font-size:10px;color:var(--faint);font-family:monospace}
.bk-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bk-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:background .12s,transform .06s}
.bk-btn:active{transform:scale(.98)}
.bk-btn.primary{background:var(--gold);color:#fff}
.bk-btn.danger{background:var(--red-pale);color:var(--red)}
.bk-btn.ok{background:var(--green-pale);color:var(--green)}

/* ========== TAB BAR ========== */

<script>

/* Equipment is now mutable — persisted in localStorage so Admin can add items
   and the Digital Handover Log can auto-flag readiness */
const EQUIP_KEY='vutv.equip.equipment.v1';
function loadEquipment(){try{const s=JSON.parse(localStorage.getItem(EQUIP_KEY));return Array.isArray(s)&&s.length?s:null;}catch{return null;}}

let EQUIPMENT = loadEquipment() || JSON.parse(JSON.stringify(DEFAULT_EQUIPMENT));

const KITS = [
  {id:'kit-interview',name:'Interview Kit',icon:'mic',desc:'Camera + Mic + Light • Perfect for sit-down interviews',items:['cam1','mic1','lite1'],type:'Interview'},
  {id:'kit-broll',name:'B-Roll Kit',icon:'film',desc:'Camera + Tripod + Light • Cinematic B-roll footage',items:['cam1','tri1','lite1'],type:'B-Roll'},
  {id:'kit-podcast',name:'Podcast Kit',icon:'headphones',desc:'Mic + Recorder • Crisp audio for podcasting',items:['mic1','rec1'],type:'Podcast'},
  {id:'kit-full',name:'Full Production Kit',icon:'camera',desc:'All available gear • For major productions',items:['cam1','mic1','tri1','lite1'],type:'Full Production'}
];

const COORDINATOR = {name:'Aarav Mehta',role:'VUTV Equipment Desk',initials:'AM'};
const BOOKING_KEY='vutv.equip.bookings.v2';
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const addDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return dateKey(d);};
const dateLabel=date=>new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const dateLabelShort=date=>new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const timeLabel=time=>new Date('2000-01-01T'+time).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const timeOptions=sel=>{let h='';for(let i=9;i<=18;i++){for(let m of ['00','30']){if(i===18&&m==='30')continue;let v=String(i).padStart(2,'0')+':'+m;h+='<option value="'+v+'"'+(v===sel?' selected':'')+'>'+timeLabel(v)+'</option>';}}return h;};
const interval=(date,time)=>new Date(date+'T'+time).getTime();
const overlaps=(aS,aE,bS,bE)=>aS<bE && bS<aE;
const bookingStart=b=>interval(b.startDate,b.startTime);
const bookingEnd=b=>interval(b.endDate,b.endTime);
const blocks=b=>['pending','confirmed','active'].includes(b.status);
const bookingsFromStorage=()=>{try{const s=JSON.parse(localStorage.getItem(BOOKING_KEY));return Array.isArray(s)?s:null;}catch{return null;}};
function saveBookings(){try{localStorage.setItem(BOOKING_KEY,JSON.stringify(S.bookings));}catch{toast('Bookings could not be saved');}}
function conflictFor(draft,bookings,excludeId){
  return bookings.find(b=>b.id!==excludeId && b.eqId===draft.equipmentId && blocks(b) && b.startDate && overlaps(interval(draft.startDate,draft.startTime),interval(draft.endDate,draft.endTime),bookingStart(b),bookingEnd(b)));
}
function newDraft(id){
  const now=new Date(),today=dateKey(now);
  const startHour=Math.max(9,Math.ceil((now.getHours()+now.getMinutes()/60)/2)*2);
  const startDate=startHour>=16?addDays(today,1):today;
  const startTime=String(startHour>=16?9:startHour).padStart(2,'0')+':00';
  const endTime=String((startHour>=16?9:startHour)+2).padStart(2,'0')+':00';
  return {equipmentId:id,startDate,endDate:startDate,startTime,endTime,purpose:'Academic project',requester:'',destination:'',coordinator:COORDINATOR.name,status:'pending'};
}
function bookingDate(b){return b.startDate?dateLabelShort(b.startDate)+(b.endDate!==b.startDate?' – '+dateLabelShort(b.endDate):''):'';}
function bookingTime(b){return b.startTime?timeLabel(b.startTime)+' – '+timeLabel(b.endTime):'';}
function formatRange(d){return dateLabelShort(d.startDate)+' '+timeLabel(d.startTime)+' – '+(d.endDate!==d.startDate?dateLabelShort(d.endDate)+' ':'')+ timeLabel(d.endTime);}
function validateDraft(d){
  if(!d||!getEq(d.equipmentId)) return 'Choose equipment first';
  if(!d.requester.trim()) return 'Enter a requester or team name';
  if(!d.destination.trim()) return 'Enter where the equipment will be used';
  if(!d.startDate||!d.endDate||!d.startTime||!d.endTime) return 'Select dates and times';
  if(interval(d.startDate,d.startTime)<Date.now()) return 'Choose a future start time';
  if(interval(d.endDate,d.endTime)<=interval(d.startDate,d.startTime)) return 'End must be after start';
  if(getEq(d.equipmentId).avail==='repair') return 'This item needs repair';
  return '';
}

/* ========== DIGITAL HANDOVER LOG — auto-flag helper ========== */
function handoverAutoFlag(eqId, condition){
  const e = getEq(eqId);
  if(!e) return;
  if(condition !== 'Working fine'){
    e.avail = 'repair';
    e.ready = 'repair';
    e.condition = condition === 'Battery low' ? 'Battery low — needs charging' : 'Damage reported by producer';
    const d = new Date();
    e.lastChecked = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    saveEquipment();
  }
}

function shell(title,bodyHtml,o){
  o=o||{};
  const back=o.back?'<button class="iconbtn" data-act="go" data-to="'+o.back+'" data-arg="'+(o.backArg||'')+'">'+ic('x',16)+'</button>':'';
  const right=o.right||'';

  const logo=(title==='Home'||title==='Admin Dashboard')?'<img src="assets/vutv-logo.png" class="logo-sm" alt="VUTV">':'';
  return '<div class="top">'+back+logo+'<h1>'+esc(title)+'</h1>'+accountBtn()+right+'</div><div class="body" id="body">'+bodyHtml+'</div>'+tabs;
}

function tabBar(){
  const t=[['home',ic('home',18),'Home'],['equipment',ic('grid',18),'Browse'],['kits',ic('box',18),'Kits'],['sharedcalendar',ic('calendar',18),'Calendar'],['mybookings',ic('list',18),'Bookings']];

function availPill(a){
  const m={available:['<span class="dot-live"></span> Available','p-avail'],inuse:['In use','p-inuse'],repair:['Needs repair','p-repair']};
  const p=m[a]||['Unknown','p-repair'];
  return '<span class="pill '+p[1]+'">'+p[0]+'</span>';
}
function readyPill(r){
  const m={ready:[ic('check',10)+' Ready','p-ready'],check:[ic('alert',10)+' Check','p-used'],'repair':['Repair','p-repair']};
  const p=m[r]||['Unknown','p-repair'];
  return '<span class="pill '+p[1]+'">'+p[0]+'</span>';
}
function statusPill(s){
  const m={pending:['Pending','p-used'],confirmed:['Confirmed','p-confirmed'],active:['Active','p-active'],completed:['Completed','p-completed'],returned:['Returned','p-returned']};
  const p=m[s]||['Unknown','p-repair'];
  return '<span class="pill '+p[1]+'">'+p[0]+'</span>';
}

function availTimeline(eqId){
  let h='<div class="avail-tl">';
  for(let hr=9;hr<=17;hr+=2){
    const start=String(hr).padStart(2,'0')+':00',end=String(Math.min(hr+2,18)).padStart(2,'0')+':00';
    const today=dateKey(new Date());
    const probe={equipmentId:eqId,startDate:today,endDate:today,startTime:start,endTime:end};
    const taken=conflictFor(probe,S.bookings)||interval(today,start)<Date.now();
    h+='<div class="avail-block '+(taken?'booked':'free')+'"><span style="color:var(--'+(taken?'red':'green')+')">'+(hr>12?hr-12:hr)+(hr>=12?'p':'a')+'</span></div>';
  }
  h+='</div>';
  return h;
}

  h+='<div style="display:flex;gap:6px">'+availPill(state)+readyPill(e.ready)+'</div>';

  // Today's availability timeline
  h+='<p class="label">Today\'s availability</p>';

  // Details table

  h+='<div><span>Location</span><b>'+esc(e.location)+'</b></div>';

  h+='<div><span>Last checked</span><b>'+esc(e.lastChecked)+'</b></div>';
  const next=S.bookings.filter(b=>b.eqId===e.id&&blocks(b)&&bookingEnd(b)>Date.now()).sort((a,b)=>bookingStart(a)-bookingStart(b))[0];

  // In-use banner
  if(state==='inuse'){
    const active=S.bookings.find(b=>b.eqId===e.id&&blocks(b)&&bookingStart(b)<=Date.now()&&bookingEnd(b)>Date.now());
    h+='<div class="banner info"><strong>Currently in use</strong>'+(active?'Until '+esc(dateLabelShort(active.endDate))+' '+esc(timeLabel(active.endTime))+'. ':'')+'You can reserve a future window.</div>';
  }
  if(state!=='repair'){
    h+='<button class="btn primary" data-act="startbook" data-id="'+e.id+'">'+(state==='inuse'?'Book for later':'Book this equipment')+'</button>';
  } else {
    h+='<button class="btn ghost" disabled>Currently unavailable — needs repair</button>';
  }
  return shell(e.name,h,{back:'equipment'});
};

V.calendar=()=>{
  const d=S.bookingDraft,e=getEq(d&&d.equipmentId);
  if(!e) return V.equipment();
  const [year,month]=S.selectedMonth.split('-').map(Number);
  const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate();
  let h='<div style="font-size:14px;font-weight:600;color:var(--ink)">'+esc(e.name)+'</div>';
  h+='<div style="font-size:12px;color:var(--sub)">Selected: '+esc(dateLabelShort(S.selectedDate))+'</div>';

  // Calendar
  h+='<div class="card" style="padding:12px"><div class="cal-head">';
  h+='<button class="cal-nav" data-act="month" data-val="-1" aria-label="Previous month">'+ic('chevronL',16)+'</button>';
  h+='<span class="cal-month">'+first.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</span>';
  h+='<button class="cal-nav" data-act="month" data-val="1" aria-label="Next month">'+ic('chevronR',16)+'</button></div><div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(day=>h+='<div class="cal-lbl">'+day+'</div>');
  for(let i=0;i<first.getDay();i++) h+='<span class="cal-d empty"></span>';
  for(let i=1;i<=days;i++){
    const day=year+'-'+String(month).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    const hasBooking=S.bookings.some(b=>b.eqId===e.id&&blocks(b)&&b.startDate<=day&&b.endDate>=day);
    h+='<button class="cal-d'+(day===S.selectedDate?' sel':'')+(hasBooking?' has-booking':'')+'" data-act="calday" data-val="'+day+'" aria-label="'+esc(dateLabel(day))+'" '+(day<dateKey(new Date())?'disabled':'')+'>'+i+'</button>';
  }
  h+='</div></div>';

  // Quick slots
  h+='<p class="label">Quick slots — '+esc(dateLabelShort(S.selectedDate))+'</p>';
  for(let hour=9;hour<=15;hour+=2){
    const start=String(hour).padStart(2,'0')+':00',end=String(hour+2).padStart(2,'0')+':00';
    const probe={equipmentId:e.id,startDate:S.selectedDate,endDate:S.selectedDate,startTime:start,endTime:end};
    const taken=conflictFor(probe,S.bookings)||interval(S.selectedDate,start)<Date.now();
    h+=taken?'<div class="slot taken"><span class="slot-time">'+timeLabel(start)+' – '+timeLabel(end)+'</span><span class="slot-badge s-taken">Unavailable</span></div>':'<button class="slot avail" data-act="selectslot" data-val="'+start+'" style="width:100%"><span class="slot-time">'+timeLabel(start)+' – '+timeLabel(end)+'</span><span class="slot-badge s-free">Select</span></button>';
  }

  // Divider
  h+='<div class="divider"><span>or custom time</span></div>';

  // Custom interval
  h+='<div class="card" style="padding:14px"><div style="font-size:12px;font-weight:600;color:var(--ink);margin-bottom:10px">Custom interval</div>';
  h+='<div class="grid2"><div class="field"><label for="startDate">Start date</label><input id="startDate" type="date" min="'+dateKey(new Date())+'" value="'+esc(d.startDate)+'" data-draft="startDate"></div>';
  h+='<div class="field"><label for="startTime">Start time</label><select id="startTime" data-draft="startTime">'+timeOptions(d.startTime)+'</select></div>';
  h+='<div class="field"><label for="endDate">End date</label><input id="endDate" type="date" min="'+esc(d.startDate)+'" value="'+esc(d.endDate)+'" data-draft="endDate"></div>';
  h+='<div class="field"><label for="endTime">End time</label><select id="endTime" data-draft="endTime">'+timeOptions(d.endTime)+'</select></div></div></div>';

  h+='<button class="btn primary" data-act="continuebooking">Continue with selected time</button>';
  h+='<button class="btn quiet" data-act="go" data-to="equipment">Cancel</button>';
  return shell('Select Date & Time',h,{back:'detail',backArg:e.id,hideTabs:true});
};

V.mybookings=()=>{
  const upcoming=S.bookings.filter(b=>b.status==='pending'||b.status==='confirmed'||b.status==='active');
  const completed=S.bookings.filter(b=>b.status==='completed'||b.status==='returned');

    h+='<div class="bk-name">'+esc(b.eq)+'</div><div class="bk-meta">'+esc(bookingDate(b))+', '+esc(bookingTime(b))+'</div>';
    h+='<div class="bk-loc">'+ic('mappin',11)+' '+esc(b.loc)+'</div>';

    if(b.status==='confirmed'&&!b.checkOut) h+='<button class="bk-btn ok" data-act="checkout" data-id="'+b.id+'" style="flex:1">Check-Out</button>';
    if(b.startDate)h+='<button class="bk-btn" data-act="extend" data-id="'+b.id+'" style="flex:1;background:var(--bg-deep);color:var(--ink)">Extend</button>';
    h+='<button class="bk-btn primary" data-act="markreturn" data-id="'+b.id+'" style="flex:1">Return</button>';
    h+='<button class="bk-btn danger" data-act="confirmcancel" data-id="'+b.id+'" style="flex:1">Cancel</button></div>';

    h+='<div class="card"><h3>No completed bookings yet</h3></div>';
  }
  completed.forEach(b=>{
    h+='<div class="bk" style="opacity:'+(b.status==='completed'&&!b.rating?'1':'.7')+'"><div class="bk-content"><div class="bk-bar d"></div><div class="bk-body"><div class="bk-top">'+statusPill(b.status)+'<span class="bk-ref">'+esc(b.ref)+'</span></div>';
    h+='<div class="bk-name">'+esc(b.eq)+'</div><div class="bk-meta">'+esc(bookingDate(b))+', '+esc(bookingTime(b))+'</div>';
    if(b.returnCondition)h+='<div class="bk-loc">Returned: '+esc(b.returnCondition)+(b.returnNotes?' · '+esc(b.returnNotes):'')+'</div>';
    if(b.returnPhoto)h+='<img src="'+esc(b.returnPhoto)+'" alt="Return photo" style="max-width:100%;max-height:100px;border-radius:8px;margin-top:6px">';
    h+='</div></div></div>';

      h+='<button class="bk-btn ok" data-act="givefeedback" data-id="'+b.id+'" style="margin-top:-1px;width:100%;padding:8px 14px">Give feedback</button>';

    if(b.rating) h+='<div style="margin-top:-1px;padding:4px 14px;font-size:11px;color:var(--sub);display:flex;align-items:center;gap:3px">Rated '+b.rating+'/5 '+ic('star',10)+'</div>';
  });
  h+='<button class="btn primary" data-act="tab" data-to="equipment" style="margin-top:12px">Browse Equipment</button>';
  return shell('My Bookings',h);
};

V.kits=()=>{

  KITS.forEach(kit=>{
    const items=kit.items.map(id=>getEq(id)).filter(Boolean);

    h+='<span class="kit-count">'+availCount+'/'+items.length+'</span>';

      h+='<div class="kit-item"><div class="kit-item-icon '+(ok?'ok':'bad')+'">'+( ok?ic('check',16):ic('alert',16))+'</div>';
      h+='<span class="kit-item-name">'+esc(e.name)+'</span>';

  });
  return shell('Kit Builder',h);
};

V.kitcalendar=()=>{
  const kit=KITS.find(k=>k.id===S.kitDraft?.kitId);
  if(!kit) return V.kits();
  const items=kit.items.map(id=>getEq(id)).filter(e=>e&&availability(e)!=='repair');
  const [year,month]=S.selectedMonth.split('-').map(Number);
  const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate();
  let h='<div style="display:flex;align-items:center;gap:8px"><span style="color:var(--gold-deep)">'+ic(kit.icon,22)+'</span><div><div style="font-size:14px;font-weight:600;color:var(--ink)">'+esc(kit.name)+'</div><div style="font-size:12px;color:var(--sub)">'+items.length+' items · '+esc(dateLabelShort(S.selectedDate))+'</div></div></div>';

  // Calendar
  h+='<div class="card" style="padding:12px"><div class="cal-head">';

  h+='<button class="cal-nav" data-act="month" data-val="1">'+ic('chevronR',16)+'</button></div><div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(day=>h+='<div class="cal-lbl">'+day+'</div>');
  for(let i=0;i<first.getDay();i++) h+='<span class="cal-d empty"></span>';
  for(let i=1;i<=days;i++){
    const day=year+'-'+String(month).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    h+='<button class="cal-d'+(day===S.selectedDate?' sel':'')+'" data-act="calday" data-val="'+day+'" '+(day<dateKey(new Date())?'disabled':'')+'>'+i+'</button>';
  }
  h+='</div></div>';

  // Slots for all items
  h+='<p class="label">Available for all items — '+esc(dateLabelShort(S.selectedDate))+'</p>';
  for(let hour=9;hour<=15;hour+=2){
    const start=String(hour).padStart(2,'0')+':00',end=String(hour+2).padStart(2,'0')+':00';
    let conflict=false;
    items.forEach(e=>{
      const probe={equipmentId:e.id,startDate:S.selectedDate,endDate:S.selectedDate,startTime:start,endTime:end};
      if(conflictFor(probe,S.bookings)||interval(S.selectedDate,start)<Date.now()) conflict=true;

V.sharedcalendar=()=>{
  const [year,month]=S.calendarMonth.split('-').map(Number);
  const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate();
  const today=dateKey(new Date());
  let h='<h2>Equipment Calendar</h2><p class="lead">Booking density across the month. Tap a day to see details.</p>';

  // Month nav
  h+='<div class="card" style="padding:12px"><div class="cal-head">';
  h+='<button class="cal-nav" data-act="calmonth" data-val="-1">'+ic('chevronL',16)+'</button>';
  h+='<span class="cal-month">'+first.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</span>';
  h+='<button class="cal-nav" data-act="calmonth" data-val="1">'+ic('chevronR',16)+'</button></div>';

  // Density grid
  h+='<div class="density-grid">';
  ['S','M','T','W','T','F','S'].forEach(d=>h+='<div class="cal-lbl" style="aspect-ratio:auto">'+d+'</div>');
  for(let i=0;i<first.getDay();i++) h+='<div class="density-cell empty"></div>';
  for(let i=1;i<=days;i++){
    const day=year+'-'+String(month).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    const count=S.bookings.filter(b=>b.startDate&&b.startDate<=day&&b.endDate>=day&&blocks(b)).length;
    const density=Math.min(count,4);
    const isSel=day===S.calendarDate;
    h+='<button class="density-cell density-'+density+(isSel?' sel':'')+'" data-act="caldrill" data-val="'+day+'">';
    h+='<span class="dc-day">'+i+'</span>';
    if(count>0){
      h+='<span class="dc-dots">';
      for(let d=0;d<Math.min(count,3);d++) h+='<span class="dc-dot" style="background:var('+(d<2?'--gold':'--red')+')"></span>';
      if(count>3) h+='<span style="font-size:7px;color:var(--sub)">+</span>';
      h+='</span>';
    }
    h+='</button>';
  }
  h+='</div></div>';

  // Drill-down
  h+='<p class="label">'+esc(dateLabelShort(S.calendarDate))+'</p>';
  const dayBookings=S.bookings.filter(b=>b.startDate&&b.startDate<=S.calendarDate&&b.endDate>=S.calendarDate&&blocks(b));
  if(dayBookings.length){
    dayBookings.forEach(b=>{
      const statusColor=b.status==='pending'?'var(--gold)':b.status==='active'?'var(--navy)':'var(--green)';
      h+='<div class="drill-booking">';
      h+='<div class="db-color" style="background:'+statusColor+'"></div>';
      h+='<div class="db-info"><div class="db-name">'+esc(b.eq)+'</div>';
      h+='<div class="db-time">'+esc(bookingTime(b))+' · '+(b.requester?esc(b.requester):'—')+'</div></div>';
      h+=statusPill(b.status)+'</div>';
    });
  } else {
    h+='<div class="card" style="text-align:center"><h3>No bookings</h3><p>No equipment is booked on this day.</p></div>';
  }
  return shell('Calendar',h);
};

/* ===================== ACTIONS ===================== */
let pendingCheckoutCond='';
let pendingCheckinCond='';

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act,id=el.dataset.id,to=el.dataset.to,val=el.dataset.val,arg=el.dataset.arg;

  if(act==='tab'){setTab(to);return;}
  if(act==='admintab'){setAdminTab(to);return;}
  if(act==='go'){go(to,arg);return;}

  if(act==='openaccount'){showModal('account');return;}
  if(act==='switchaccount'){
    hideModal();
    S.role=val;
    if(val==='admin'){S.adminTab=S.adminTab||'admin-dash';go(S.adminTab);}
    else{S.tab='home';go('home');}
    return;
  }
  if(act==='detail'){go('detail',id);return;}
  if(act==='startbook'){
    S.selectedEq=id;
    S.bookingDraft=newDraft(id);
    S.selectedDate=S.bookingDraft.startDate;
    S.selectedMonth=S.selectedDate.slice(0,7);
    S.view={name:'loading'};render();
    setTimeout(()=>{if(S.view.name==='loading')go('calendar',id);},300);
    return;
  }
  if(act==='month'){
    const [year,month]=S.selectedMonth.split('-').map(Number);
    const next=new Date(year,month-1+Number(val),1);
    S.selectedMonth=dateKey(next).slice(0,7);
    render();return;
  }
  if(act==='calmonth'){
    const [year,month]=S.calendarMonth.split('-').map(Number);
    const next=new Date(year,month-1+Number(val),1);
    S.calendarMonth=dateKey(next).slice(0,7);
    S.calendarDate=S.calendarMonth+'-01';
    render();return;
  }
  if(act==='calday'){
    S.selectedDate=val;
    if(S.bookingDraft){
      S.bookingDraft.startDate=val;
      if(S.bookingDraft.endDate<val)S.bookingDraft.endDate=val;
    }
    render();return;
  }
  if(act==='selectslot'){
    const d=S.bookingDraft;
    d.startDate=S.selectedDate;d.endDate=S.selectedDate;
    d.startTime=val;
    d.endTime=String(Number(val.slice(0,2))+2).padStart(2,'0')+':00';
    if(conflictFor(d,S.bookings)||interval(d.startDate,d.startTime)<Date.now()){go('conflict',d.equipmentId);return;}
    go('bookingform',d.equipmentId);return;
  }
  if(act==='continuebooking'){
    const d=S.bookingDraft;
    if(!d.startDate||!d.endDate||!d.startTime||!d.endTime||interval(d.startDate,d.startTime)<Date.now()||interval(d.endDate,d.endTime)<=interval(d.startDate,d.startTime)){toast('Choose a valid future interval');return;}
    if(conflictFor(d,S.bookings)){go('conflict',d.equipmentId);return;}
    go('bookingform',d.equipmentId);return;
  }
  if(act==='reviewbooking'){
    const error=validateDraft(S.bookingDraft);
    if(error){toast(error);return;}
    if(conflictFor(S.bookingDraft,S.bookings)){go('conflict',S.bookingDraft.equipmentId);return;}
    go('review',S.bookingDraft.equipmentId);return;
  }
  if(act==='confirm'){
    const d=S.bookingDraft,error=validateDraft(d);
    if(error){toast(error);go('bookingform',d&&d.equipmentId);return;}
    S.bookings=bookingsFromStorage()||S.bookings;
    if(conflictFor(d,S.bookings)){go('conflict',d.equipmentId);return;}
    const e=getEq(d.equipmentId);
    const bid='b'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
    const b={...d,id:bid,ref:'VR-'+bid.slice(1,9).toUpperCase(),eq:e.name,eqId:e.id,loc:e.location,rating:null,feedback:null};
    S.bookings.unshift(b);
    S.lastBookingId=bid;
    saveBookings();
    go('success',e.id);
    return;
  }

  // Cancel confirmation modal
  if(act==='confirmcancel'){showModal('cancelConfirm',id);return;}
  if(act==='dismissmodal'){hideModal();return;}
  if(act==='docancel'){
    S.bookings=S.bookings.filter(b=>b.id!==id);
    saveBookings();hideModal();
    toast('Booking cancelled');render();return;
  }

  // ========== DIGITAL HANDOVER LOG ACTIONS ==========
  // Check-out
  if(act==='checkout'){pendingCheckoutCond='';go('checkout',id);return;}
  if(act==='setCheckoutCond'){
    pendingCheckoutCond=val;
    const opts=document.querySelectorAll('#checkoutOpts button');
    opts.forEach(o=>o.classList.toggle('on',o.dataset.val===val));
    return;
  }
  if(act==='doCheckout'){
    if(!pendingCheckoutCond){toast('Select equipment condition');return;}
    const b=S.bookings.find(x=>x.id===id);
    if(!b)return;
    const note=($('checkoutNote')?$('checkoutNote').value:'').trim();
    b.checkOut={condition:pendingCheckoutCond,note:note,time:new Date().toISOString()};
    b.status='active';
    // AUTO-FLAG: if anything other than "Working fine", flag equipment
    handoverAutoFlag(b.eqId, pendingCheckoutCond);
    saveBookings();
    if(pendingCheckoutCond!=='Working fine'){
      toast('Equipment flagged as "Needs repair" — visible to all');
    } else {
      toast('Check-out complete');
    }
    go('mybookings');return;
  }
  // Check-in condition selector
  if(act==='setCheckinCond'){
    pendingCheckinCond=val;
    const opts=document.querySelectorAll('#checkinOpts button');
    opts.forEach(o=>o.classList.toggle('on',o.dataset.val===val));
    return;
  }

  // ========== ADMIN ACTIONS ==========
  if(act==='approve'){
    const b=S.bookings.find(x=>x.id===id);
    if(b){b.status='confirmed';saveBookings();toast('Booking approved');render();}
    return;
  }
  if(act==='reject'){
    const b=S.bookings.find(x=>x.id===id);
    if(b){b.status='rejected';saveBookings();toast('Booking rejected');render();}
    return;
  }
  if(act==='clearrepair'){
    const e=getEq(id);
    if(e){
      e.avail='available';e.ready='ready';
      e.condition='Repaired and verified';
      const d=new Date();
      e.lastChecked=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      saveEquipment();
      toast('Equipment marked as fixed');render();
    }
    return;
  }
  if(act==='addequip'){
    const name=($('newEqName')?$('newEqName').value:'').trim();
    const cat=$('newEqCat')?$('newEqCat').value:'Cameras';
    const asset=($('newEqAsset')?$('newEqAsset').value:'').trim();
    const condition=($('newEqCondition')?$('newEqCondition').value:'Good').trim()||'Good';
    const location=($('newEqLocation')?$('newEqLocation').value:'').trim();
    if(!name){toast('Enter equipment name');return;}
    if(!asset){toast('Enter asset ID');return;}
    if(!location){toast('Enter location');return;}
    const newId='eq-'+Date.now();
    EQUIPMENT.push({id:newId,name,cat,asset:asset.toUpperCase(),img:null,avail:'available',ready:'ready',battery:null,condition,location,lastChecked:'Just added',rating:null});
    saveEquipment();
    toast('Equipment added: '+name);render();
    return;
  }

  // ========== SHARED CALENDAR ACTIONS ==========
  if(act==='calmonth'){
    const [yr,mo]=S.calendarMonth.split('-').map(Number);
    const next=new Date(yr,mo-1+Number(val),1);
    S.calendarMonth=dateKey(next).slice(0,7);
    render();return;
  }
  if(act==='caldrill'){
    S.calendarDate=val;
    render();return;
  }

  if(act==='extend'){go('extend',id);return;}
  if(act==='saveextension'){
    const b=S.bookings.find(x=>x.id===id);
    if(!b)return;
    const endDate=$('extendDate').value,endTime=$('extendTime').value;
    if(!endDate||!endTime||interval(endDate,endTime)<=bookingEnd(b)){toast('Choose an end later than current');return;}
    const extension={equipmentId:b.eqId,startDate:b.endDate,startTime:b.endTime,endDate,endTime};
    S.bookings=bookingsFromStorage()||S.bookings;
    const current=S.bookings.find(x=>x.id===id);
    if(!current||!blocks(current)){toast('Booking no longer active');go('mybookings');return;}
    if(conflictFor(extension,S.bookings,id)){toast('Extension overlaps another booking');return;}
    current.endDate=endDate;current.endTime=endTime;
    saveBookings();toast('Booking extended');go('mybookings');return;
  }
  if(act==='markreturn'){pendingCheckinCond='';go('returnconfirm',id);return;}
  if(act==='doreturn'){
    if(!pendingCheckinCond){toast('Select equipment condition');return;}
    const b=S.bookings.find(x=>x.id===id);
    if(!b){return;}
    const file=$('returnPhoto')?$('returnPhoto').files[0]:null;
    const finish=photo=>{
      b.checkIn={condition:pendingCheckinCond,note:($('returnNotes')?$('returnNotes').value:'').trim(),time:new Date().toISOString()};
      b.returnCondition=pendingCheckinCond;
      b.returnNotes=b.checkIn.note;
      b.returnPhoto=photo;b.status='completed';saveBookings();
      // AUTO-FLAG: if anything other than "Working fine", flag equipment
      handoverAutoFlag(b.eqId, pendingCheckinCond);
      if(pendingCheckinCond!=='Working fine'){
        toast('Return recorded — equipment flagged "Needs repair"');
      } else {
        toast('Return recorded');
      }
      go('feedback',id);
    };
    if(!file){finish(null);return;}
    if(!file.type.startsWith('image/')){toast('Choose an image file');return;}
    const img=new Image(),reader=new FileReader();
    reader.onerror=()=>toast('Could not read image');
    reader.onload=()=>{img.src=reader.result;};
    img.onerror=()=>toast('Could not process image');
    img.onload=()=>{
      const scale=Math.min(1,640/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      finish(canvas.toDataURL('image/jpeg',.65));
    };
    reader.readAsDataURL(file);return;
  }
  if(act==='givefeedback'){pendingRating=0;pendingCond='';go('feedback',id);return;}
  if(act==='rate'){
    pendingRating=Number(val);
    const stars=document.querySelectorAll('#stars button');
    stars.forEach((s,i)=>{s.classList.toggle('on',i<pendingRating);s.innerHTML=i<pendingRating?'&#9733;':'&#9734;';});
    return;
  }
  if(act==='setcond'){
    pendingCond=val;
    const opts=document.querySelectorAll('#condOpts .fbtn');
    opts.forEach(o=>o.classList.toggle('on',o.dataset.val===val));
    return;
  }
  if(act==='submitfeedback'){
    if(!pendingRating||!pendingCond){toast('Choose a rating and condition');return;}
    const b=S.bookings.find(x=>x.id===id);
    if(b){
      b.rating=pendingRating;b.feedback=pendingCond;
      const notes=$('fb-notes');
      if(notes&&notes.value.trim()) b.feedback+=': '+notes.value.trim();
      saveBookings();
    }
    toast('Feedback submitted — thank you!');S.tab='mybookings';go('mybookings');return;
  }
  if(act==='refresh'){
    const d=new Date();
    S.lastUpdated=String(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+(d.getHours()>=12?' PM':' AM');
    toast('Status updated');render();return;
  }
  if(act==='filter'){S.filter=val;render();return;}
  if(act==='clearsearch'){S.search='';S.filter='All';render();return;}
  if(act==='viewbooking'){S.tab='mybookings';go('mybookings');return;}

  // Kit Builder actions
  if(act==='bookkit'){
    const kit=KITS.find(k=>k.id===id);
    if(!kit)return;
    S.kitDraft={kitId:kit.id,startDate:dateKey(new Date()),endDate:dateKey(new Date()),startTime:'09:00',endTime:'11:00',requester:'',destination:''};
    S.selectedDate=S.kitDraft.startDate;
    S.selectedMonth=S.selectedDate.slice(0,7);
    go('kitcalendar');return;
  }
  if(act==='kitstartslot'){
    const kd=S.kitDraft;
    kd.startDate=S.selectedDate;kd.endDate=S.selectedDate;
    kd.startTime=val;kd.endTime=String(Number(val.slice(0,2))+2).padStart(2,'0')+':00';
    showModal('kitForm',kd.kitId);return;
  }
  if(act==='kitformsubmit'){
    const req=$('kitRequester')?.value?.trim();
    const dest=$('kitDest')?.value?.trim();
    if(!req){toast('Enter your name');return;}
    if(!dest){toast('Enter usage location');return;}
    S.kitDraft.requester=req;S.kitDraft.destination=dest;
    hideModal();go('kitreview');return;
  }
  if(act==='confirmkit'){
    const kit=KITS.find(k=>k.id===S.kitDraft?.kitId);
    if(!kit)return;
    const kd=S.kitDraft;
    const items=kit.items.map(id=>getEq(id)).filter(e=>e&&availability(e)!=='repair');
    items.forEach(e=>{
      const bid='k'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
      S.bookings.unshift({
        id:bid,ref:'VR-'+bid.slice(1,9).toUpperCase(),eq:e.name,eqId:e.id,
        equipmentId:e.id,startDate:kd.startDate,endDate:kd.endDate,startTime:kd.startTime,endTime:kd.endTime,
        purpose:kit.type+' production',requester:kd.requester,destination:kd.destination,
        coordinator:COORDINATOR.name,status:'confirmed',loc:e.location,rating:null,feedback:null
      });
    });
    saveBookings();go('kitsuccess');return;
  }
});

// Search input
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.draft&&S.bookingDraft){S.bookingDraft[t.dataset.draft]=t.value;}
  if(t.dataset&&t.dataset.act==='search'){S.search=t.value;render();}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.draft&&S.bookingDraft){
    S.bookingDraft[t.dataset.draft]=t.value;
    if(t.dataset.draft==='startDate'){
      S.selectedDate=t.value;S.selectedMonth=t.value.slice(0,7);
      if(S.bookingDraft.endDate<t.value)S.bookingDraft.endDate=t.value;
      render();
    }
  }
});

// Reset demo
$('resetBtn').addEventListener('click',()=>{
  localStorage.removeItem(BOOKING_KEY);
  localStorage.removeItem(EQUIP_KEY);
  EQUIPMENT.length=0;
  DEFAULT_EQUIPMENT.forEach(e=>EQUIPMENT.push(JSON.parse(JSON.stringify(e))));
  S=seedState();pendingRating=0;pendingCond='';pendingCheckoutCond='';pendingCheckinCond='';
  toast('Reset to initial state');render();
});

/* ===================== CLOCK ===================== */
function clock(){
  const el=$('clock');if(!el) return;
  const d=new Date(),h=d.getHours()%12||12;
  el.textContent=h+':'+String(d.getMinutes()).padStart(2,'0');
}
clock();setInterval(clock,20000);

/* ===================== FIT ===================== */
function fit(){
  if(window.innerWidth<=560) return;
  const k=Math.min((window.innerHeight-40)/2694,(window.innerWidth-40)/1278);
  document.documentElement.style.setProperty('--k',k);
}
window.addEventListener('resize',fit);
fit();

/* ===================== BOOT ===================== */
render();
</script>
</body>
</html>
